[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-fraud-detection"
version = "1.0.0"
description = "Production-Grade Transaction Fraud Detection Pipeline with MICE Imputation, Temporal Pattern Mining, Hybrid Resampling (RUS+SMOTE), Optuna Tree Ensembles, and XAI (TreeSHAP & LIME)"
readme = "README.md"
authors = [{ name = "Devan Singh Faujdar" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.11.0",
    "optuna>=3.4.0",
    "shap>=0.43.0",
    "lime>=0.2.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pydantic>=2.5.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
