[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-fraudlab"
version = "1.0.0"
description = "Reproducible ULB credit-card fraud experiments with honest provenance"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
  "scikit-learn==1.7.2", "imbalanced-learn==0.14.0",
  "xgboost==3.0.5", "optuna==4.5.0", "shap==0.49.1",
  "lime==0.2.0.1", "matplotlib>=3.8,<4", "joblib>=1.4,<2", "PyYAML>=6,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
[project.scripts]
fraudlab = "fraudlab.cli:main"
[tool.setuptools.packages.find]
include = ["fraudlab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
