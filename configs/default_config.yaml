# Transaction Fraud Detection Engine - Pipeline Configuration
pipeline:
  name: "transaction_fraud_detection"
  version: "1.0.0"
  random_state: 42

paths:
  raw_data: "data/creditcard.csv"
  synthetic_data: "data/synthetic_transactions.csv"
  processed_data: "data/processed_transactions.parquet"
  artifacts_dir: "artifacts"
  models_dir: "artifacts/models"
  figures_dir: "artifacts/figures"
  reports_dir: "reports"

data_generation:
  total_samples: 284807
  fraud_samples: 492
  missing_values_to_inject: 45000
  random_seed: 42

imputation:
  method: "mice"
  max_iter: 10
  initial_strategy: "median"
  n_nearest_features: 10
  random_state: 42

feature_engineering:
  temporal:
    lag_steps: [1, 2]
    ema_alpha: 0.3
    rolling_window: 10
    diurnal_period_hours: 24.0
    use_log_amount: true
  selection:
    correlation_threshold: 0.85
    vif_threshold: 10.0
    mutual_info_top_k: null

resampling:
  two_stage_hybrid: true
  rus_ratio: 0.1        # Stage 1: downsample majority negatives from 1:578 to 1:10
  smote_ratio: 1.0      # Stage 2: SMOTE minority to 1:1 balance with downsampled negatives
  smote_k_neighbors: 5
  random_state: 42

modeling:
  cv_splits: 5
  optuna:
    n_trials: 25
    timeout_seconds: 600
    metric: "pr_auc"    # Average Precision
  random_forest:
    n_estimators: 150
    max_depth: 10
    min_samples_split: 5
    n_jobs: -1
    random_state: 42
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 1.0
    random_state: 42
    n_jobs: -1
  ensemble:
    default_xgb_weight: 0.55
    default_rf_weight: 0.45
    decision_threshold: 0.45

explainability:
  shap:
    background_samples: 100
    test_samples: 50
  lime:
    num_features: 8
    num_samples: 1000
